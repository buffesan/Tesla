name: Fetch CC engine audio

on:
  push:
    paths:
      - '.github/workflows/fetch-engine-audio.yml'

permissions:
  contents: write

jobs:
  fetch-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download licensed source recording
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 -A 'TeslaSoundLab/1.0 (https://github.com/buffesan/Tesla)' 'https://upload.wikimedia.org/wikipedia/commons/9/98/Maserati_GranTurismo_S_Exhaust.ogg' -o assets/maserati-granturismo-s.ogg
          test -s assets/maserati-granturismo-s.ogg
          ls -lh assets/maserati-granturismo-s.ogg

      - name: Commit original CC BY 4.0 recording
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/maserati-granturismo-s.ogg
          if git diff --cached --quiet; then
            echo 'Audio source already present'
            exit 0
          fi
          git commit -m 'Add CC BY 4.0 Maserati V8 source recording'
          git push
