name: Import V5 CC0 engine loop bank

on:
  push:
    paths:
      - '.github/workflows/fetch-engine-audio.yml'

permissions:
  contents: write

jobs:
  import-engine-loops:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download CC0 stationary engine loops
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/v5

          BASE='https://raw.githubusercontent.com/yashimosh/border-run/main/public/sfx/engine'
          curl -L --fail --retry 3 "$BASE/loop_0.wav"   -o assets/v5/engine_0.wav
          curl -L --fail --retry 3 "$BASE/loop_1_0.wav" -o assets/v5/engine_1.wav
          curl -L --fail --retry 3 "$BASE/loop_2_0.wav" -o assets/v5/engine_2.wav
          curl -L --fail --retry 3 "$BASE/loop_3_0.wav" -o assets/v5/engine_3.wav
          curl -L --fail --retry 3 "$BASE/loop_4_0.wav" -o assets/v5/engine_4.wav
          curl -L --fail --retry 3 "$BASE/loop_5_0.wav" -o assets/v5/engine_5.wav

          for f in assets/v5/engine_*.wav; do
            test -s "$f"
            echo "$f $(stat -c%s "$f") bytes"
          done

          cat > assets/v5/SOURCE.md <<'EOF'
          # V5 engine loop source

          Source work: **racing car engine sound loops** by domasx2
          Original source: https://opengameart.org/content/racing-car-engine-sound-loops
          License: **CC0 1.0 Universal**
          License URL: https://creativecommons.org/publicdomain/zero/1.0/

          The six WAV files are mirrored from:
          https://github.com/yashimosh/border-run/tree/main/public/sfx/engine

          The original OpenGameArt author states the loops were remade from a
          public-domain car recording and released as CC0. In this project the
          loops are crossfaded and slightly rate-shifted in real time to follow
          simulated RPM.
          EOF

      - name: Commit loop bank
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/v5
          if git diff --cached --quiet; then
            echo 'V5 audio bank already present'
            exit 0
          fi
          git commit -m 'Add CC0 stationary engine loop bank for V5'
          git push
