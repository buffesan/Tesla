name: Build Ferrari V8 loop proof

on:
  push:
    paths:
      - '.github/workflows/build-v8-preview.yml'
      - 'tools/build_v8_preview.py'

permissions:
  contents: write

jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install renderer dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy

      - name: Render 18-second loop proof
        run: |
          python tools/build_v8_preview.py
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -y -hide_banner -loglevel error             -i preview/ferrari-v8-loop-proof.wav             -c:a libmp3lame -b:a 256k             preview/ferrari-v8-loop-proof.mp3

      - name: Add licence and credits
        shell: bash
        run: |
          cat > preview/CREDITS.md <<'EOF'
          # Ferrari V8 loop proof - credits

          This is a technical sound proof only; it is not yet used by the Tesla Sound Lab app.

          Processed loop source:
          - Project: V8 Engine Explorer by Syed Sabeeth
          - https://github.com/ssabeeth/v8-engine-explorer
          - Sound loops derived from recordings by Edvvc:
            - Ferrari 458 Italia
            - Ferrari F430 (2010)
          - Licence for the processed sound loops: CC BY-SA 3.0
          - https://creativecommons.org/licenses/by-sa/3.0/

          The source project states that the recording sections were measured for engine RPM,
          pitch-flattened where necessary, crossfaded into seamless loops and level-matched.

          This preview is an adaptation and is shared under CC BY-SA 3.0.
          EOF

      - name: Commit preview only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add preview/ferrari-v8-loop-proof.wav                   preview/ferrari-v8-loop-proof.mp3                   preview/CREDITS.md
          if git diff --cached --quiet; then
            echo 'Preview already current'
            exit 0
          fi
          git commit -m 'Add Ferrari V8 seamless-loop audio proof'
          git push
