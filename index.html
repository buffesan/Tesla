<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d10" />
  <title>Model Y Sound Lab V2</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">MODEL Y PERFORMANCE · V2</div>
        <h1>Sound Lab</h1>
      </div>
      <div id="gpsBadge" class="badge">GPS AUS</div>
    </header>

    <section class="hero card">
      <div class="metric speed">
        <span id="speed">0</span><small>km/h</small>
      </div>
      <div class="rpm-wrap">
        <div class="rpm-track"><div id="rpmBar" class="rpm-bar"></div></div>
        <div class="rpm-label"><span id="rpm">850</span> rpm</div>
      </div>
      <div class="gear-row">
        <span>GANG</span><strong id="gear">N</strong>
      </div>
      <div class="engine-profile">V8 PERFORMANCE</div>
    </section>

    <section class="controls card">
      <button id="startBtn" class="primary">START ENGINE</button>
      <button id="gpsBtn">GPS STARTEN</button>
      <button id="demoBtn">DEMO-MODUS</button>
      <button id="stopBtn" class="danger">STOP</button>
    </section>

    <section class="card settings">
      <label>Intensität <span id="intensityValue">78%</span>
        <input id="intensity" type="range" min="0" max="100" value="78" />
      </label>
      <label>Character <span id="characterValue">68%</span>
        <input id="character" type="range" min="0" max="100" value="68" />
      </label>
      <label>Crackle <span id="crackleValue">30%</span>
        <input id="crackle" type="range" min="0" max="100" value="30" />
      </label>
    </section>

    <section id="demoPanel" class="card demo hidden">
      <div class="demo-title">Virtuelles Fahrpedal</div>
      <input id="throttle" type="range" min="0" max="100" value="0" />
      <div class="demo-actions">
        <button data-speed="0">0</button>
        <button data-speed="50">50</button>
        <button data-speed="100">100</button>
        <button data-speed="160">160</button>
      </div>
    </section>

    <section class="card status">
      <div><span>Status</span><strong id="status">Bereit</strong></div>
      <div><span>Beschleunigung</span><strong id="accel">0.00 m/s²</strong></div>
      <div><span>Audio</span><strong id="audioState">Aus</strong></div>
    </section>

    <p class="note">V2: geschmeidigere GPS-Glättung, Lastwechsel, Schaltmomente und mehrschichtiger V8-Sound. Bedienung nur im Stand.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
